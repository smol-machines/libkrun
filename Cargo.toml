[workspace]
members = [
    "init",
    "src/libkrun",
    "src/init_blob",
    "src/input",
    "src/display",
    "src/utils",
    "src/arch_gen",
    "src/cpuid",
    "src/smbios",
    "src/polly",
    "src/kernel",
    "src/arch",
    "src/hvf",
    "src/devices",
    "src/vmm",
    "src/aws_nitro",
    "src/rutabaga_gfx",
    "src/whp",
]
exclude = ["examples/gtk_display", "vendor/linux-loader"]
resolver = "2"

# Vendored linux-loader patched to pull vm-memory with default-features = false.
# Upstream pulls vm-memory's default (Unix-only `rawfd`) feature, which breaks the
# Windows build through global feature unification. See vendor/linux-loader.
[patch.crates-io]
linux-loader = { path = "vendor/linux-loader" }

[profile.dev]
#panic = "abort"

[profile.release]
#panic = "abort"
lto = true
