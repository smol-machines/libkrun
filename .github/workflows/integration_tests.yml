name: Integration tests
on: [pull_request]

env:
  # Use a release with published binaries; latest may be source-only.
  LIBKRUNFW_VERSION: v5.5.0

jobs:
  integration-tests-x86_64:
    name: Integration Tests (Linux x86_64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld
      
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      
      - name: Add FreeBSD x86_64 target
        run: rustup target add x86_64-unknown-freebsd
      
      - name: Install FreeBSD test prerequisites
        run: sudo apt-get install -y --no-install-recommends libarchive-tools
      
      - name: Build FreeBSD sysroot and init
        run: make BUILD_BSD_INIT=1 -- init/init-freebsd
      
      - name: Install gvproxy
        run: |
          curl -fL -o /tmp/gvproxy https://github.com/containers/gvisor-tap-vsock/releases/download/v0.8.9/gvproxy-linux-amd64
          chmod +x /tmp/gvproxy
          sudo mv /tmp/gvproxy /usr/local/bin/gvproxy
      
      - name: Build and install libkrun to test prefix
        run: make test-prefix NET=1 BLK=1
      
      - name: Clippy (test_cases guest)
        run: |
          cd tests
          cargo clippy --locked -p test_cases --features guest -- -D warnings
      
      - name: Clippy (test_cases host)
        run: |
          cd tests
          PKG_CONFIG_PATH="$(realpath ../test-prefix/lib64/pkgconfig/)" LD_LIBRARY_PATH="$(realpath ../test-prefix/lib64/)" cargo clippy --locked -p test_cases --features host -- -D warnings
      
      - name: Clippy (runner)
        run: |
          cd tests
          PKG_CONFIG_PATH="$(realpath ../test-prefix/lib64/pkgconfig/)" LD_LIBRARY_PATH="$(realpath ../test-prefix/lib64/)" cargo clippy --locked -p runner -- -D warnings
      
      - name: Clippy (guest-agent)
        run: |
          cd tests
          cargo clippy --locked --target x86_64-unknown-linux-musl -p guest-agent -- -D warnings
      
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -a -G kvm $USER
      
      - name: Install additional packages
        run: sudo apt-get install -y --no-install-recommends build-essential patchelf pkg-config net-tools buildah dnsmasq iperf3 e2fsprogs
      
      - name: Install passt from source
        run: |
          curl -L https://passt.top/passt/snapshot/passt-2026_01_20.386b5f5.tar.gz | tar xz
          cd passt-2026_01_20.386b5f5
          make
          sudo make install
      
      - name: Install libkrunfw
        run: |
          curl -fL --retry 3 -o /tmp/libkrunfw-x86_64.tgz "https://github.com/libkrun/libkrunfw/releases/download/$LIBKRUNFW_VERSION/libkrunfw-x86_64.tgz"
          echo 'c169206b01c89fbe134f1728bf4f988702bc7f73b4cf73e6fdece447d6fceca1  /tmp/libkrunfw-x86_64.tgz' | sha256sum --check --strict
          mkdir tmp && tar xf /tmp/libkrunfw-x86_64.tgz -C tmp && sudo mv tmp/lib64/* /lib/x86_64-linux-gnu
      
      - name: Integration tests
        run: KRUN_ENOMEM_WORKAROUND=1 KRUN_TEST_BASE_DIR=/tmp/libkrun-tests make test NET=1 BLK=1 IPERF_DURATION=3 TEST_FLAGS="--keep-all --github-summary"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-x86_64
          path: |
            /tmp/libkrun-tests/
            !/tmp/libkrun-tests/**/guest-agent
            !/tmp/libkrun-tests/**/rootfs
          if-no-files-found: ignore

  integration-tests-aarch64:
    name: Integration Tests (Linux aarch64)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      
      - name: Add musl target
        run: rustup target add aarch64-unknown-linux-musl
      
      - name: Install nightly toolchain with rust-src for FreeBSD aarch64
        run: rustup +nightly-2026-01-25 component add rust-src
      
      - name: Install FreeBSD test prerequisites
        run: sudo apt-get install -y --no-install-recommends libarchive-tools
      
      - name: Build FreeBSD sysroot and init
        run: make BUILD_BSD_INIT=1 -- init/init-freebsd
      
      - name: Install gvproxy
        run: |
          curl -fL -o /tmp/gvproxy https://github.com/containers/gvisor-tap-vsock/releases/download/v0.8.9/gvproxy-linux-arm64
          chmod +x /tmp/gvproxy
          sudo mv /tmp/gvproxy /usr/local/bin/gvproxy
      
      - name: Build and install libkrun to test prefix
        run: make test-prefix NET=1 BLK=1
      
      - name: Clippy (test_cases guest)
        run: |
          cd tests
          cargo clippy --locked -p test_cases --features guest -- -D warnings
      
      - name: Clippy (test_cases host)
        run: |
          cd tests
          PKG_CONFIG_PATH="$(realpath ../test-prefix/lib64/pkgconfig/)" LD_LIBRARY_PATH="$(realpath ../test-prefix/lib64/)" cargo clippy --locked -p test_cases --features host -- -D warnings
      
      - name: Clippy (runner)
        run: |
          cd tests
          PKG_CONFIG_PATH="$(realpath ../test-prefix/lib64/pkgconfig/)" LD_LIBRARY_PATH="$(realpath ../test-prefix/lib64/)" cargo clippy --locked -p runner -- -D warnings
      
      - name: Clippy (guest-agent)
        run: |
          cd tests
          cargo clippy --locked --target aarch64-unknown-linux-musl -p guest-agent -- -D warnings
      
      - name: Install additional packages
        run: sudo apt-get install -y --no-install-recommends build-essential patchelf pkg-config net-tools dnsmasq iperf3 git uidmap e2fsprogs
      
      - name: Install passt from source
        run: |
          curl -L https://passt.top/passt/snapshot/passt-2026_01_20.386b5f5.tar.gz | tar xz
          cd passt-2026_01_20.386b5f5
          make
          sudo make install
      
      - name: Install libkrunfw
        run: |
          curl -fL --retry 3 -o /tmp/libkrunfw-aarch64.tgz "https://github.com/libkrun/libkrunfw/releases/download/$LIBKRUNFW_VERSION/libkrunfw-aarch64.tgz"
          echo 'b04c9a5520a1ea52b5b35d87559566872246145961c4b6978034c9b9be54b89b  /tmp/libkrunfw-aarch64.tgz' | sha256sum --check --strict
          mkdir tmp && tar xf /tmp/libkrunfw-aarch64.tgz -C tmp && sudo mv tmp/lib64/* /lib/aarch64-linux-gnu

      - name: Clean up tests directory
        run: rm -fr /tmp/libkrun-tests
      
      - name: Integration tests
        run: KRUN_ENOMEM_WORKAROUND=1 KRUN_NO_UNSHARE=1 KRUN_TEST_BASE_DIR=/tmp/libkrun-tests make test NET=1 BLK=1 IPERF_DURATION=3 TEST_FLAGS="--keep-all --github-summary"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-aarch64
          path: |
            /tmp/libkrun-tests/
            !/tmp/libkrun-tests/**/guest-agent
            !/tmp/libkrun-tests/**/rootfs
          if-no-files-found: ignore
