name: Code Quality
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    name: libkrun (Windows cross)
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-musl
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 musl-tools clang libclang-dev
      - name: Check the Windows block and network backend
        run: cargo check --locked --target x86_64-pc-windows-gnu -p libkrun --features blk,net

  code-quality-linux-x86_64:
    name: libkrun (Linux x86_64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (default)
        run: cargo clippy --locked -- -D warnings
      
      - name: Clippy (amd-sev)
        run: cargo clippy --locked --features amd-sev -- -D warnings
      
      - name: Clippy (tdx)
        run: cargo clippy --locked --features tdx -- -D warnings
      
      - name: Clippy (net+blk+gpu+input)
        run: cargo clippy --locked --features net,blk,gpu,input -- -D warnings

  code-quality-linux-aarch64:
    name: libkrun (Linux aarch64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (default)
        run: cargo clippy --locked -- -D warnings
      
      - name: Clippy (net+blk+gpu+input)
        run: cargo clippy --locked --features net,blk,gpu,input -- -D warnings

  code-quality-macos:
    name: libkrun (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (gpu)
        run: cargo clippy --locked --features gpu -- -D warnings
        env:
          KRUN_INIT_BINARY_PATH: ${{ github.workspace }}/init/init
